<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="230" fill="#E2E4E9" />
  
  <!-- Subtractive Blend Mode for CMY overlap -->
  <g style="mix-blend-mode: multiply;">
    <!-- Yellow Circle -->
    <circle cx="250" cy="185" r="110" fill="#FFF200" />
    <!-- Cyan Circle -->
    <circle cx="185" cy="295" r="110" fill="#00AEEF" />
    <!-- Magenta Circle -->
    <circle cx="315" cy="295" r="110" fill="#EC008C" />
  </g>
</svg>
